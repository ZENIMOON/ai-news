<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>AIニュース</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📰</text></svg>">
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1c2128;
    --muted: #57606a;
    --border: #d8dee4;
    --accent: #0969da;
    --red: #d1242f;
    --yellow: #bf8700;
    --green: #1a7f37;
    --code-bg: #eff1f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --text: #e6edf3;
      --muted: #8b949e;
      --border: #30363d;
      --accent: #58a6ff;
      --red: #ff7b72;
      --yellow: #d29922;
      --green: #3fb950;
      --code-bg: #21262d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
  }
  .header-inner {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .header-inner h1 {
    font-size: 18px;
    margin: 0;
    flex: 1;
    white-space: nowrap;
  }
  .nav {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .nav button, .nav select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .nav button:disabled { opacity: 0.35; cursor: default; }
  .nav button:not(:disabled):active { background: var(--border); }
  #radio.playing {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 16px;
  }
  .status {
    text-align: center;
    color: var(--muted);
    padding: 48px 0;
    font-size: 14px;
  }
  article h1 {
    font-size: 22px;
    margin: 8px 0 4px;
  }
  article h2 {
    font-size: 17px;
    margin: 28px 0 12px;
    padding: 8px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 5px solid var(--accent);
    border-radius: 8px;
  }
  article h2.sec-red    { border-left-color: var(--red); }
  article h2.sec-yellow { border-left-color: var(--yellow); }
  article h2.sec-green  { border-left-color: var(--green); }
  article h3 {
    font-size: 16px;
    margin: 0 0 8px;
  }
  .item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  article ul { margin: 0; padding-left: 20px; }
  article li { margin: 4px 0; font-size: 14.5px; }
  article a {
    color: var(--accent);
    text-decoration: none;
    word-break: break-all;
  }
  article a:hover { text-decoration: underline; }
  article blockquote {
    margin: 12px 0;
    padding: 10px 14px;
    border-left: 4px solid var(--border);
    background: var(--card);
    border-radius: 0 8px 8px 0;
    color: var(--muted);
    font-size: 13.5px;
  }
  article blockquote p { margin: 4px 0; }
  article code {
    background: var(--code-bg);
    border-radius: 5px;
    padding: 1px 6px;
    font-size: 13px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  article pre {
    background: var(--code-bg);
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
  }
  article pre code { background: none; padding: 0; }
  article p { margin: 8px 0; font-size: 14.5px; }
  footer {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px 40px;
    color: var(--muted);
    font-size: 12.5px;
    text-align: center;
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>📰 AIニュース</h1>
    <div class="nav">
      <button id="radio" title="ラジオ再生" disabled>📻 再生</button>
      <button id="prev" title="前の日">←</button>
      <select id="datePicker"></select>
      <button id="next" title="次の日">→</button>
    </div>
  </div>
</header>
<main>
  <div id="content"><div class="status">読み込み中…</div></div>
</main>
<footer>
  毎朝9時に自動更新 ·
  <a href="https://github.com/ZENIMOON/ai-news" target="_blank" rel="noopener">GitHub</a>
</footer>
<script>
const OWNER = "ZENIMOON";
const REPO = "ai-news";
const API_LIST = `https://api.github.com/repos/${OWNER}/${REPO}/contents/daily?ref=main`;
const RAW_BASE = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/daily/`;

const contentEl = document.getElementById("content");
const pickerEl = document.getElementById("datePicker");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");

let dates = []; // desc order (newest first)
let current = 0;
let currentMd = ""; // markdown of the displayed day (for radio)

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function inline(s) {
  // apply inline markdown to an already-escaped string
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|[^"'>=\]])(https?:\/\/[^\s<),、]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return s;
}

function renderMarkdown(md) {
  const lines = md.split("\n");
  let html = "";
  let listOpen = false, quoteOpen = false, codeOpen = false, itemOpen = false;
  const closeList = () => { if (listOpen) { html += "</ul>"; listOpen = false; } };
  const closeQuote = () => { if (quoteOpen) { html += "</blockquote>"; quoteOpen = false; } };
  const closeItem = () => { closeList(); if (itemOpen) { html += "</div>"; itemOpen = false; } };

  for (const raw of lines) {
    const line = raw.replace(/\s+$/, "");
    if (line.startsWith("```")) {
      closeList(); closeQuote();
      html += codeOpen ? "</code></pre>" : "<pre><code>";
      codeOpen = !codeOpen;
      continue;
    }
    if (codeOpen) { html += esc(raw) + "\n"; continue; }

    if (/^### /.test(line)) {
      closeItem(); closeQuote();
      html += '<div class="item"><h3>' + inline(esc(line.slice(4))) + "</h3>";
      itemOpen = true;
    } else if (/^## /.test(line)) {
      closeItem(); closeQuote();
      const t = line.slice(3);
      let cls = "";
      if (t.includes("\u{1F534}")) cls = "sec-red";
      else if (t.includes("\u{1F7E1}")) cls = "sec-yellow";
      else if (t.includes("\u{1F7E2}")) cls = "sec-green";
      html += `<h2 class="${cls}">` + inline(esc(t)) + "</h2>";
    } else if (/^# /.test(line)) {
      closeItem(); closeQuote();
      html += "<h1>" + inline(esc(line.slice(2))) + "</h1>";
    } else if (/^> ?/.test(line)) {
      closeList();
      if (!quoteOpen) { html += "<blockquote>"; quoteOpen = true; }
      html += "<p>" + inline(esc(line.replace(/^> ?/, ""))) + "</p>";
    } else if (/^- /.test(line)) {
      closeQuote();
      if (!listOpen) { html += "<ul>"; listOpen = true; }
      html += "<li>" + inline(esc(line.slice(2))) + "</li>";
    } else if (line.trim() === "") {
      closeList(); closeQuote();
    } else {
      closeList(); closeQuote();
      html += "<p>" + inline(esc(line)) + "</p>";
    }
  }
  if (codeOpen) html += "</code></pre>";
  closeItem(); closeQuote();
  return html;
}

function updateNav() {
  pickerEl.value = dates[current];
  prevBtn.disabled = current >= dates.length - 1; // older
  nextBtn.disabled = current <= 0; // newer
}

async function show(idx) {
  current = idx;
  updateNav();
  stopRadio();
  radioBtn.disabled = true;
  contentEl.innerHTML = '<div class="status">読み込み中…</div>';
  try {
    const res = await fetch(RAW_BASE + dates[idx] + ".md", { cache: "no-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const md = await res.text();
    currentMd = md;
    contentEl.innerHTML = "<article>" + renderMarkdown(md) + "</article>";
    radioBtn.disabled = false;
    window.scrollTo(0, 0);
  } catch (e) {
    contentEl.innerHTML = '<div class="status">記事を読み込めませんでした（' + esc(String(e.message)) + '）</div>';
  }
}

// ---------------- 📻 ラジオ（読み上げ + BGM） ----------------
const radioBtn = document.getElementById("radio");
let radioPlaying = false;
let audioCtx = null, bgmGain = null, bgmTimer = null;
let voiceAudio = null; // 事前生成mp3の再生用
let bgmAudio = null;   // ユーザー配置のBGMファイル再生用
let bgmTracks = [];    // docs/bgm/ 内の曲一覧（初期化時に取得）
const BGM_VOLUME = 0.22;

async function loadBgmTracks() {
  try {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/docs/bgm?ref=main`, { cache: "no-cache" });
    if (!res.ok) return;
    const files = await res.json();
    bgmTracks = files
      .map(f => f.name)
      .filter(n => /\.(mp3|m4a|ogg|wav)$/i.test(n))
      .map(n => "bgm/" + encodeURIComponent(n));
  } catch (e) {}
}

const CHORDS = [ // lo-fi風の静かな循環コード（周波数Hz）
  [130.81, 164.81, 196.00, 246.94], // Cmaj7
  [110.00, 130.81, 164.81, 196.00], // Am7
  [87.31, 130.81, 174.61, 220.00],  // Fmaj7
  [98.00, 123.47, 146.83, 196.00],  // G
];

function startBGM() {
  // ユーザーがbgm/フォルダに置いた曲があればそれを小音量ループ再生
  if (bgmTracks.length > 0) {
    const track = bgmTracks[Math.floor(Math.random() * bgmTracks.length)];
    bgmAudio = new Audio(track);
    bgmAudio.loop = true;
    bgmAudio.volume = BGM_VOLUME;
    bgmAudio.play().catch(() => { bgmAudio = null; startSynthBGM(); });
    return;
  }
  startSynthBGM();
}

function startSynthBGM() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const filter = audioCtx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = 800;
  bgmGain = audioCtx.createGain();
  bgmGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  bgmGain.gain.exponentialRampToValueAtTime(0.045, audioCtx.currentTime + 2);
  bgmGain.connect(filter);
  filter.connect(audioCtx.destination);

  let step = 0;
  const CHORD_SEC = 4.8;
  const playChord = () => {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    for (const freq of CHORDS[step % CHORDS.length]) {
      const osc = audioCtx.createOscillator();
      const env = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      osc.detune.value = (Math.random() - 0.5) * 8; // わずかな揺らぎ
      env.gain.setValueAtTime(0.0001, t);
      env.gain.exponentialRampToValueAtTime(0.25, t + 1.2);
      env.gain.exponentialRampToValueAtTime(0.0001, t + CHORD_SEC + 0.4);
      osc.connect(env);
      env.connect(bgmGain);
      osc.start(t);
      osc.stop(t + CHORD_SEC + 0.5);
    }
    step++;
  };
  playChord();
  bgmTimer = setInterval(playChord, CHORD_SEC * 1000);
}

function stopBGM() {
  if (bgmAudio) {
    const a = bgmAudio;
    bgmAudio = null;
    // 1秒かけてフェードアウト
    const fade = setInterval(() => {
      a.volume = Math.max(0, a.volume - BGM_VOLUME / 10);
      if (a.volume <= 0) { clearInterval(fade); a.pause(); }
    }, 100);
  }
  if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
  if (audioCtx) {
    const ctx = audioCtx, gain = bgmGain;
    audioCtx = null; bgmGain = null;
    try {
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1);
    } catch (e) {}
    setTimeout(() => ctx.close().catch(() => {}), 1200);
  }
}

function cleanForSpeech(s) {
  return s
    .replace(/https?:\/\/[^\s),、]+/g, "")           // URL除去
    .replace(/\*\*([^*]+)\*\*/g, "$1")               // 太字記法
    .replace(/`([^`]+)`/g, "$1")                     // コード記法
    .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")         // リンク記法
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}]/gu, "") // 絵文字
    .replace(/[×✕]/g, "と")
    .replace(/\s+/g, " ")
    .trim();
}

function buildSpeechScript(md, dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const parts = [`AIニュース、${y}年${m}月${d}日号です。`];
  let sectionCount = 0;
  let inCode = false;
  for (const raw of md.split("\n")) {
    const line = raw.trim();
    if (line.startsWith("```")) { inCode = !inCode; continue; }
    if (inCode || line === "" || line.startsWith("# ") || line.startsWith(">")) continue;
    if (line.startsWith("## ")) {
      const name = cleanForSpeech(line.slice(3));
      parts.push((sectionCount === 0 ? "まずは、" : "続いて、") + name + "の話題です。");
      sectionCount++;
    } else if (line.startsWith("### ")) {
      parts.push(cleanForSpeech(line.slice(4)) + "。");
    } else if (line.startsWith("- ")) {
      const item = line.slice(2);
      if (/^情報源/.test(item)) continue;
      let t = cleanForSpeech(item.replace(/^要約[:：]\s*/, ""));
      if (/^\*?\*?活用ポイント/.test(item)) {
        t = "活用ポイント。" + cleanForSpeech(item.replace(/^\*\*活用ポイント[:：]?\*\*\s*/, ""));
      }
      if (t) parts.push(t);
    } else {
      const t = cleanForSpeech(line);
      if (t) parts.push(t);
    }
  }
  parts.push("以上、本日のAIニュースでした。");
  return parts.filter(p => p.length > 0);
}

function pickVoice() {
  const voices = speechSynthesis.getVoices();
  return voices.find(v => /Google.*日本語/.test(v.name))
      || voices.find(v => v.lang && v.lang.startsWith("ja") && /Kyoko|O-?ren|Otoya/i.test(v.name))
      || voices.find(v => v.lang && v.lang.startsWith("ja"))
      || null;
}

function speakParts(parts, i) {
  if (!radioPlaying || i >= parts.length) { stopRadio(); return; }
  const u = new SpeechSynthesisUtterance(parts[i]);
  const v = pickVoice();
  if (v) u.voice = v;
  u.lang = "ja-JP";
  u.rate = 1.05;
  u.onend = () => speakParts(parts, i + 1);
  u.onerror = () => speakParts(parts, i + 1);
  speechSynthesis.speak(u);
}

function speakFallback() {
  if (!radioPlaying) return;
  speechSynthesis.cancel();
  // 音声リストの読み込みが遅れる環境（iOS等）への対応
  const begin = () => speakParts(buildSpeechScript(currentMd, dates[current]), 0);
  if (speechSynthesis.getVoices().length === 0) {
    let started = false;
    speechSynthesis.addEventListener("voiceschanged", () => {
      if (!started && radioPlaying) { started = true; begin(); }
    }, { once: true });
    setTimeout(() => { if (!started && radioPlaying) { started = true; begin(); } }, 300);
  } else {
    begin();
  }
}

function startRadio() {
  if (!currentMd) return;
  radioPlaying = true;
  radioBtn.textContent = "⏹ 停止";
  radioBtn.classList.add("playing");
  startBGM();
  // 事前生成の高音質mp3（OpenAI TTS）があれば優先。なければブラウザ音声で読み上げ。
  let fellBack = false;
  const fallback = () => {
    if (fellBack || !radioPlaying) return;
    fellBack = true;
    voiceAudio = null;
    speakFallback();
  };
  voiceAudio = new Audio("audio/" + dates[current] + ".mp3");
  voiceAudio.onended = () => stopRadio();
  voiceAudio.onerror = fallback;
  voiceAudio.play().catch(fallback);
}

function stopRadio() {
  if (!radioPlaying && !audioCtx) return;
  radioPlaying = false;
  if (voiceAudio) {
    voiceAudio.onerror = null;
    voiceAudio.pause();
    voiceAudio = null;
  }
  speechSynthesis.cancel();
  stopBGM();
  radioBtn.textContent = "📻 再生";
  radioBtn.classList.remove("playing");
}

radioBtn.addEventListener("click", () => {
  if (radioPlaying) stopRadio();
  else startRadio();
});
window.addEventListener("pagehide", stopRadio);

async function init() {
  try {
    const res = await fetch(API_LIST, { cache: "no-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const files = await res.json();
    dates = files
      .map(f => f.name)
      .filter(n => /^\d{4}-\d{2}-\d{2}\.md$/.test(n))
      .map(n => n.replace(/\.md$/, ""))
      .sort()
      .reverse();
    if (dates.length === 0) {
      contentEl.innerHTML = '<div class="status">まだ記事がありません。明朝9時の配信をお待ちください。</div>';
      return;
    }
    pickerEl.innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join("");
    loadBgmTracks(); // 裏で取得（📻再生までに揃っていればOK）
    await show(0);
  } catch (e) {
    contentEl.innerHTML = '<div class="status">記事一覧を取得できませんでした（' + esc(String(e.message)) + '）。時間をおいて再読み込みしてください。</div>';
  }
}

prevBtn.addEventListener("click", () => { if (current < dates.length - 1) show(current + 1); });
nextBtn.addEventListener("click", () => { if (current > 0) show(current - 1); });
pickerEl.addEventListener("change", () => show(dates.indexOf(pickerEl.value)));

init();
</script>
</body>
</html>
